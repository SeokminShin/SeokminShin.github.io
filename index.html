<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seokmin Shin</title>

    <!-- Consolidate search signals on the portfolio rather than on this stub. -->
    <link rel="canonical" href="https://seokminshin.github.io/portfolio/" />

    <!-- Fallback for clients with JavaScript disabled. -->
    <meta http-equiv="refresh" content="0; url=https://seokminshin.github.io/portfolio/" />

    <!--
      replace() rather than assign() so this stub leaves no history entry and the
      browser Back button returns the visitor where they came from.
    -->
    <script>
      location.replace("https://seokminshin.github.io/portfolio/");
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #475569;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      a {
        color: #a31f34;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Last-resort fallback if neither the script nor the meta refresh runs. -->
    <p>
      Redirecting to
      <a href="https://seokminshin.github.io/portfolio/">seokminshin.github.io/portfolio</a>
    </p>
  </body>
</html>
